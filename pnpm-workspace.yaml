blockExoticSubdeps: true
childConcurrency: 1
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@caslon/*'
  - '@cassiopeia/*'
  - '@cepheus/*'
  - '@escapace/*'
  - '@pangram/*'
  - '@pointe/*'
  - caslon
  - cassiopeia
  - cepheus
  - coastal
  - eslint-config-escapace
  - esroll
  - fastify-fetch
  - pointe
  - prettier-config-escapace
  - seedpods
  - snaproll
  # Renovate security update: lodash-es@4.17.23
  - lodash-es@4.17.23
onlyBuiltDependencies:
  - esbuild
  - lefthook
  - oxc-resolver
strictDepBuilds: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - eslint
  - '@eslint/*'
  - ts-api-utils@2.3.0
